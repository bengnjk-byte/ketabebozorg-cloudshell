name: deploy-readonly
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ketabebozorg-orchestrator
      REGION: australia-southeast1
      SERVICE: ketabebozorg-orchestrator
      EXPECT_SHA: daede0951db98e8442bb44e43eae64c1bf1e237082dec7cd51140129b05b87f2
      EXPECT_BYTES: "76877"
    steps:
      - uses: actions/checkout@v4
      - name: require frozen zip
        run: |
          test -f V6.zip.b64
          base64 -d V6.zip.b64 > KETABEBOZORG_DUAL_ORCHESTRATOR_V6.zip
          test "$(wc -c < KETABEBOZORG_DUAL_ORCHESTRATOR_V6.zip)" -eq "$EXPECT_BYTES"
          echo "$EXPECT_SHA  KETABEBOZORG_DUAL_ORCHESTRATOR_V6.zip" | sha256sum -c
      - name: refuse write mode in this workflow
        run: |
          if echo "$EXECUTION_MODE$ORCHESTRATOR_MODE" | grep -Eq 'WRITE|SCHEDULER|PRODUCTION'; then
            echo "WRITE/Scheduler/Production forbidden in deploy-readonly"
            exit 1
          fi
      - name: require WIF variable
        run: |
          test -n "${{ vars.WIF_PROVIDER }}" || { echo "WIF_PROVIDER unset — rung 3 OPEN"; exit 1; }
      - name: auth WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ketabebozorg-runner@ketabebozorg-orchestrator.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: deploy CONNECTED_READ_ONLY private
        run: |
          unzip -o KETABEBOZORG_DUAL_ORCHESTRATOR_V6.zip
          gcloud config set project "$PROJECT_ID"
          gcloud run deploy "$SERVICE" \
            --source ketabebozorg_orchestrator \
            --region "$REGION" \
            --service-account ketabebozorg-runner@${PROJECT_ID}.iam.gserviceaccount.com \
            --no-allow-unauthenticated \
            --set-env-vars ORCHESTRATOR_MODE=CONNECTED_READ_ONLY,EXECUTION_MODE=CONNECTED_READ_ONLY \
            --quiet
          gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)'
