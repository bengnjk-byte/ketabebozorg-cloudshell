name: deploy-readonly
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ketabebozorg-orchestrator
      REGION: australia-southeast1
      SERVICE: ketabebozorg-orchestrator
      EXPECT_SHA: daede0951db98e8442bb44e43eae64c1bf1e237082dec7cd51140129b05b87f2
      EXPECT_BYTES: "76877"
    steps:
      - uses: actions/checkout@v4
      - name: require frozen zip
        run: |
          set -euo pipefail
          test -f V6.zip.b64
          SRC="$RUNNER_TEMP/v6src"
          rm -rf "$SRC"
          mkdir -p "$SRC/extract"
          base64 --decode V6.zip.b64 > "$SRC/KETABEBOZORG_DUAL_ORCHESTRATOR_V6.zip"
          test "$(wc -c < "$SRC/KETABEBOZORG_DUAL_ORCHESTRATOR_V6.zip")" -eq "$EXPECT_BYTES"
          echo "$EXPECT_SHA  $SRC/KETABEBOZORG_DUAL_ORCHESTRATOR_V6.zip" | sha256sum -c
          unzip -o "$SRC/KETABEBOZORG_DUAL_ORCHESTRATOR_V6.zip" -d "$SRC/extract"
          test -f "$SRC/extract/ketabebozorg_orchestrator/main.py"
          test -f "$SRC/extract/ketabebozorg_orchestrator/orchestrator/engine.py"
          test -f "$SRC/extract/ketabebozorg_orchestrator/Dockerfile"
          echo "SRC_DIR=$SRC/extract/ketabebozorg_orchestrator" >> "$GITHUB_ENV"
      - name: refuse helper subtree as deploy source
        run: |
          set -euo pipefail
          test -n "${SRC_DIR:-}"
          test -f "$SRC_DIR/main.py"
          test -f "$SRC_DIR/orchestrator/engine.py"
          case "$SRC_DIR" in
            "$GITHUB_WORKSPACE"/*) echo "deploy source must not be checkout helper subtree"; exit 1 ;;
          esac
      - name: refuse write mode in this workflow
        run: |
          if echo "$EXECUTION_MODE$ORCHESTRATOR_MODE" | grep -Eq 'WRITE|SCHEDULER|PRODUCTION'; then
            echo "WRITE/Scheduler/Production forbidden in deploy-readonly"
            exit 1
          fi
      - name: require WIF variable
        run: |
          test -n "${{ vars.WIF_PROVIDER }}" || { echo "WIF_PROVIDER unset — rung 3 OPEN"; exit 1; }
      - name: auth WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ketabebozorg-runner@ketabebozorg-orchestrator.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: deploy CONNECTED_READ_ONLY private
        run: |
          set -euo pipefail
          test -n "${SRC_DIR:-}"
          test -f "$SRC_DIR/main.py"
          gcloud config set project "$PROJECT_ID"
          gcloud run deploy "$SERVICE" \
            --source "$SRC_DIR" \
            --region "$REGION" \
            --service-account ketabebozorg-runner@${PROJECT_ID}.iam.gserviceaccount.com \
            --no-allow-unauthenticated \
            --set-env-vars ORCHESTRATOR_MODE=CONNECTED_READ_ONLY,EXECUTION_MODE=CONNECTED_READ_ONLY \
            --quiet
          gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)'
