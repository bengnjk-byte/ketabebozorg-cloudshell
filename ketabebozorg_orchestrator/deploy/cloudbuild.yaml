steps:
- name: gcr.io/cloud-builders/docker
  args: ['build','-t','${_IMAGE}','.']
- name: gcr.io/cloud-builders/docker
  args: ['push','${_IMAGE}']
images: ['${_IMAGE}']
substitutions:
  _IMAGE: '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/ketabebozorg-orchestrator:${BUILD_ID}'
  _REGION: 'australia-southeast1'
  _REPOSITORY: 'ketabebozorg'
